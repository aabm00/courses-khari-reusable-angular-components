
<!-- ADVANCED ANGULAR MICROSYNTAX COMPILATION RULE:
  The asterisk (*) triggers a micro-syntax parser that unwraps the expression into the <ng-template> below.

  1. INPUT PARAMETERS (From Parent to Directive):
     - Implicit Binding: The first value '5' maps directly to the primary input '[myRepeat]'.
     - Parameter Prefixing: Sub-properties 'start 6' and 'skip 2' are automatically mapped via CamelCase
       concatenation to the directive's secondary inputs: '[myRepeatStart]' and '[myRepeatSkip]'.

  2. TEMPLATE CONTEXT VARIABLES (From Directive back to Parent HTML):
     - Implicit Context ('let value'): Captures the main value sent by the directive without an explicit key.
     - Keyed Context ('let i = index'): Maps local template variables directly to keys exposed inside
       the directive's internal context object, unwrapping into 'let-value="value"', 'let-i="index"
       let isFirst = first, let isLast = last'.
-->

<div *myRepeat="5 start 6 skip 2
  let value let i = index let isFirst = first let isLast = last"
  >
  {{ i }} - Repeating text vlue {{ value }}, First: {{ isFirst }}, Last {{ isLast }}
</div>

<ng-template
  [myRepeat]="5"
  [myRepeatStart]="6"
  [myRepeatSkip]="2"
  let-value="value"
  let-i="index"
  let-isFirst="first"
  let-isLast="last"
>
  <div> {{ i }} - Repeating text vlue {{ value }}, First: {{ isFirst }}, Last {{ isLast }} </div>
</ng-template>


<!-- TIMER -->

<div *myTimer="1000; from: 10; to: 0; step: -1
  let count = value; let s = state"
>
  Count: {{ count }}, State: {{ s }}
</div>

<div *myFor></div>
