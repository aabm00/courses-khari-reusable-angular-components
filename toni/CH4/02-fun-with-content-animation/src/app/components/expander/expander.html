
<!--
  GRID REFLOW ANIMATION PATTERN:
  This accordion animates dynamic height by transitioning 'grid-template-rows' from '0fr' to '1fr'.
  The host controls the grid tracks, while the content-area utilizes animation hooks to delay
  DOM removal, allowing opacity and padding to fade out smoothly before the element leaves.
-->

<div class="header-area">
  {{header()}}
</div>

<div class="toggle-area">
  <button (click)="toggle()">
    @if (isExpanded()){
      -
    } @else{
      +
    }
  </button>
</div>


<!--
  =======================================================================================
  NUEVA API NATIVA DE ANIMACIÓN EN PLANTILLAS DE ANGULAR 22
  =======================================================================================
  * ¿Qué son 'animate.leave' y 'animate.enter'?:
    Son atributos integrados nativamente en el core de Angular 22. Reemplazan las antiguas
    configuraciones TypeScript pesadas por un enlace declarativo directo en las etiquetas.

  * ¿Cómo funcionan y cómo se conectan?:
    - Al escribir 'animate.leave="leaves"', le ordenamos a Angular: "Cuando destruyas esta
      sección debido al @if, no la borres inmediatamente; aplícale la clase CSS '.leaves'
      y espera a que sus transiciones o keyframes finalicen antes de purgarla del DOM".
    - Al escribir 'animate.enter="enters"', Angular aplica la clase '.enters' en el microsegundo
      exacto en que el elemento es renderizado por primera vez en la pantalla.
  =======================================================================================
-->
@if(isExpanded()){
  <div class="content-area"
    animate.leave="leaves"
    animate.enter="enters"> // Needed for the animation
    {{content()}}
  </div>
}
