
<!--
  =======================================================================================
  PUENTE NATIVO HACIA ATRIBUTOS GRÁFICOS VECTORIALES ([attr.d])
  =======================================================================================
  * ¿Por qué es obligatorio usar el prefijo 'attr.'?:
    La letra 'd' es un atributo físico exclusivo de las etiquetas vectoriales SVG (<path>).
    No existe ninguna propiedad nativa en el modelo de objetos JavaScript del navegador llamada
    'element.d'.

    Si intentaras escribir '[d]="pathData()"', Angular buscaría la propiedad en JavaScript,
    fallaría y lanzaría un error en la consola. Al anteponer 'attr.', le ordenas a Angular:
    "Busca el atributo HTML físico real en el nodo del navegador y escribe las coordenadas
    del vector directamente ahí".

  * ¿Por qué lleva corchetes [...]?:
    Le dice a Angular que el valor de la derecha ('pathData()') es un Signal vivo de TypeScript
    que debe ser evaluado y actualizado en tiempo real, en lugar de tratarlo como texto estático.
-->

<svg viewBox="0 0 24 24">
  <path [attr.d]="pathData()" />
</svg>
