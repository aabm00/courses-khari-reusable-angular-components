<!--
  MULTI-SLOT PROJECTION BEST PRACTICE:
  Avoid hardcoding tag selectors like 'h1' because it breaks HTML semantics, accessibility, and SEO hierarchy.
  Instead, use a custom attribute selector like '[expander-header]'. This allows the parent component
  to project any semantic tag (h2, h3, div, span) by simply adding the attribute 'expander-header'.
-->
<div class="header-area">
  <ng-content select="[expander-header]" />
</div>

<div class="toggle-area">
  <button (click)="toggle()">
    @if (isExpanded()) {
      -
    } @else {
      +
    }
  </button>
</div>

@if (isExpanded()) {
  <div class="content-area" animate.leave="leaves" animate.enter="enters">
    <ng-content />
  </div>
}
