

    <!-- Título dinámico proveído por la Signal de entrada -->
		<span>{{ title() }}</span>
		<div class="options-list">
      <!-- Renderizado agnóstico: recorremos la lista de strings genérica 'options' -->
			@for (option of options(); track option) {

        <!-- Evaluamos la igualdad leyendo las señales en tiempo de ejecución -->
				<div
					class="option-item"
					[class.is-selected]="selectedOption() === option"
					(click)="select (option)"
				>
          <!-- Renderizado básico: por ahora solo volcamos el texto plano -->
					{{ option }}
				</div>
			}
		</div>
