

<span>{{ title() }}</span>

<div class="options-list">
  @for (option of options(); track option) {
    <div
      class="option-item"
      [class.is-selected]="selectedOption() === option"
      (click)="select (option)"
    >
    <!-- Evaluación síncrona de la señal computada que busca la directiva -->
    @if( hasItemTemplate() ){
      <!-- Desempaquetamos e inyectamos la plantilla extraída a través de la directiva -->
      <ng-container *ngTemplateOutlet= "itemTemplate(); context: {$implicit: option}" />

    } @else{
      {{ option }}
    }
    </div>
  }
</div>
