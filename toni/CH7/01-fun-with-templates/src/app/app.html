<!--
  EVOLUCIÓN ERGONÓMICA DE LA API PÚBLICA:
  Hemos sustituido todas las envolturas explícitas de <ng-template> por la sintaxis de estrella (*).
  El código es mucho más limpio, intuitivo y mantiene la co-locación del diseño en una sola línea.
-->

<div class="colors-area">
  <app-item-selector
    title="Colors"
    [options]="possibleColors()"
    [(selectedOption)]="selectedColor">

    <!--
      EXPLICACIÓN DEL PROCESAMIENTO INTERNO (DESUGARING):
      La instrucción '*appItemTemplate="let color"' es interceptada por el compilador.
      Angular aplica azúcar sintáctico y genera tras bambalinas esto:
      <ng-template appItemTemplate let-color>
        <span [style.color]="color">...</span>
      </ng-template>
      El 'let-color' le indica al motor de plantillas que asigne el contexto implícito
      ($implicit) emitido por el bucle interno del componente a la variable local 'color'.

      STRUCTURAL DIRECTIVE SYNTAX EQUIVALENCE:
      The uncommented line with the asterisk ('*appItemTemplate="let color"') is exactly
      equivalent to the commented '<ng-template appItemTemplate let-color>' block below it.

      The asterisk (*) is simply syntactic sugar: at compile time, Angular intercepts it and
      automatically rewrites the <span> into an identical invisible <ng-template> in memory,
      passing the local variable 'let-color' to handle the item loop context dynamically.
    -->

    <!-- <ng-template appItemTemplate let-color>
      <span [style.color]="color"> {{ color }}</span>
    </ng-template> -->

    <span *appItemTemplate= "let color" [style.color]= "color"> {{ color }}</span>

  </app-item-selector>
</div>


<div class="fonts-area">
  <app-item-selector
    title="Fonts"
    [options]="possibleFonts()"
    [(selectedOption)]="selectedFont">
      <!-- Aplicamos la misma conversión reduciendo drásticamente la anidación del marcado -->
      <span *appItemTemplate= "let font" [style.font-family]="font"> {{ font }}</span>

  </app-item-selector>
</div>

<div class="sizes-area">
  <app-item-selector
    title="Sizes"
    [options]="possibleSizes()"
    [(selectedOption)]="selectedSize">

      <!-- Ahora activamos también la personalización visual para el selector de tamaños -->
      <span *appItemTemplate= "let size" [style.font-size]="size"> {{ size }}</span>

  </app-item-selector>
</div>

<div class="editor-area">
	<textarea
		placeholder="Type your text here..."
		[style.color]="selectedColor()"
		[style.font-family]="selectedFont()"
		[style.font-size]="selectedSize()"
	></textarea>
</div>
