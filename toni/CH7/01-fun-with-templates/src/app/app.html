

<div class="colors-area">
  <app-item-selector
    title="Colors"
    [options]="possibleColors()"
    [(selectedOption)]="selectedColor">
    <!--
      =======================================================================================
      SINTAXIS 1: RE-MAQUETACIÓN TOTAL DEL CONTENEDOR VÍA SINTAXIS DE ASTERISCO (*appItemContainer)
      =======================================================================================
      Al colocar '*appItemContainer', el compilador desazuca el bloque en memoria creando un
      <ng-template> invisible. Capturamos las tres variables tipadas estrictamente gracias al Guard.
      La clase '.color-container' y su evento click quedan bajo el control de este archivo del padre,
      redefiniendo por completo el look and feel del chip del acordeón de forma agnóstica al hijo.
    -->
    <div
      *appItemContainer= "let value; let selected= isSelected; let action= onSelect"
      class="color-container"
      [style.--color-option]="value"
      [class.chosen]= "selected"
      (click)= "action()"
    >
       {{ value }}
    </div>

    <!-- STRUCTURAL DIRECTIVE SYNTAX EQUIVALENCE:
      The uncommented line with the asterisk ('*appItemTemplate="let color"') is exactly
      equivalent to the commented '<ng-template appItemTemplate let-color>' block below it.

      The asterisk (*) is simply syntactic sugar: at compile time, Angular intercepts it and
      automatically rewrites the <span> into an identical invisible <ng-template> in memory,
      passing the local variable 'let-color' to handle the item loop context dynamically.
    -->

    <!-- <ng-template appItemTemplate let-color>
      <span [style.color]="color"> {{ color }}</span>
    </ng-template> -->

    <!-- <span *appItemTemplate= "let color" [style.color]= "color"> {{ color }}</span> -->

  </app-item-selector>
</div>


<div class="fonts-area">
  <app-item-selector
    title="Fonts"
    [options]="possibleFonts()"
    [(selectedOption)]="selectedFont">
      <!--
        =======================================================================================
        SINTAXIS 2: MODIFICACIÓN PARCIAL DE CONTENIDO (*appItemTemplate)
        =======================================================================================
        Sintaxis simplificada de asterisco: equivale exactamente al bloque <ng-template appItemTemplate>
        comentado abajo. Mantiene el contenedor estándar con check (✓) del expander hijo, pero
        altera el estilo del texto inyectando dinámicamente la tipografía 'font-family'.
      -->
      <span *appItemTemplate= "let font" [style.font-family]="font"> {{ font }}</span>

  </app-item-selector>
</div>

<div class="sizes-area">
  <app-item-selector
    title="Sizes"
    [options]="possibleSizes()"
    [(selectedOption)]="selectedSize">

    <!-- optional Template for Sizes -->
      <span *appItemTemplate= "let size" [style.font-size]="size"> {{ size }}</span>

  </app-item-selector>
</div>

<div class="editor-area">
	<textarea
		placeholder="Type your text here..."
		[style.color]="selectedColor()"
		[style.font-family]="selectedFont()"
		[style.font-size]="selectedSize()"
	></textarea>
</div>
