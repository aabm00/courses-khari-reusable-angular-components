<!--
  ALERTA DE REUSABILIDAD:
  Existe un patrón de repetición severo en las tres secciones de abajo (Color, Font, Size).
  Cada bloque replica de forma idéntica la estructura de clases CSS y la directiva de flujo `@for`.
  Objetivo Fase 1: Encapsular este marcado repetitivo dentro de un componente genérico '<app-item-selector>'.
-->

<!-- SECCIÓN 1: SELECTOR DE COLOR -->
<div class="colors-area">
	<div class="item-selector">
		<span>Color</span>
		<div class="options-list">
			@for (color of possibleColors(); track color) {
				<div
					class="option-item"
					[class.is-selected]="selectedColor() === color"
					(click)="onColorChange(color)"
				>
					{{ color }}
				</div>
			}
		</div>
	</div>
	</div>

<!-- SECCIÓN 2: SELECTOR DE FUENTE -->
<div class="fonts-area">
	<div class="item-selector">
		<span>Font</span>
		<div class="options-list">
			@for (font of possibleFonts(); track font) {
				<div
					class="option-item"
					[class.is-selected]="selectedFont() === font"
					(click)="onFontChange(font)"
				>
					{{ font }}
				</div>
			}
		</div>
	</div>
</div>

<!-- SECCIÓN 3: SELECTOR DE TAMAÑO -->
<div class="sizes-area">
	<div class="item-selector">
		<span>Size</span>
		<div class="options-list">
			@for (size of possibleSizes(); track size) {
				<div
					class="option-item"
					[class.is-selected]="selectedSize() === size"
					(click)="onSizeChange(size)"
				>
					{{ size }}
				</div>
			}
		</div>
	</div>
</div>

<!-- ÁREA DE PREVISUALIZACIÓN (EDITOR) -->
<div class="editor-area">
	<textarea
		placeholder="Type your text here..."
		[style.color]="selectedColor()"
		[style.font-family]="selectedFont()"
		[style.font-size]="selectedSize()"
	></textarea>
</div>
