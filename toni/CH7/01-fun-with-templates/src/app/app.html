

<div class="colors-area">
  <app-item-selector
    title="Colors"
    [options]="possibleColors()"
    [(selectedOption)]="selectedColor">

    <!-- optional Template for Colors -->
    <ng-template appItemTemplate let-color>
      <span [style.color]="color"> {{ color }}</span>
    </ng-template>

  </app-item-selector>
</div>


<div class="fonts-area">
  <app-item-selector
    title="Fonts"
    [options]="possibleFonts()"
    [(selectedOption)]="selectedFont">

    <!-- optional Template for Fonts -->
    <ng-template appItemTemplate let-font>
      <span [style.font-family]="font"> {{ font }}</span>
    </ng-template>
  </app-item-selector>
</div>

<div class="sizes-area">
  <app-item-selector
    title="Sizes"
    [options]="possibleSizes()"
    [(selectedOption)]="selectedSize">

    <!-- optional Template for Sizes -->
    <ng-template appItemTemplate let-size>
      <span [style.font-family]="size"> {{ size }}</span>
    </ng-template>

  </app-item-selector>
</div>

<div class="editor-area">
	<textarea
		placeholder="Type your text here..."
		[style.color]="selectedColor()"
		[style.font-family]="selectedFont()"
		[style.font-size]="selectedSize()"
	></textarea>
</div>
