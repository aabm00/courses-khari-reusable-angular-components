<!--
  APLICACIÓN DEL COMPONENTE REUTILIZABLE:
  Observa la limpieza. Pasamos la Signal de opciones desempaquetada '()' y enlazamos
  la selección de forma bidireccional usando la sintaxis de 'banana-in-a-box' [()].
-->

<!-- Área de Color reestructurada -->
<div class="colors-area">
  <app-item-selector title="Colors" [options]="possibleColors()" [(selectedOption)]="selectedColor" />
</div>

<!-- Área de Fuentes reestructurada -->
<div class="fonts-area">
  <app-item-selector title="Fonts" [options]="possibleFonts()" [(selectedOption)]="selectedFont" />
	<!-- <div class="item-selector">
		<span>Font</span>
		<div class="options-list">
			@for (font of possibleFonts(); track font) {
				<div
					class="option-item"
					[class.is-selected]="selectedFont() === font"
					(click)="onFontChange(font)"
				>
					{{ font }}
				</div>
			}
		</div>
	</div> -->
</div>

<!-- Área de Tamaños reestructurada -->
<div class="sizes-area">
  <app-item-selector title="Sizes" [options]="possibleSizes()" [(selectedOption)]="selectedSize" />
	<!-- <div class="item-selector">
		<span>Size</span>
		<div class="options-list">
			@for (size of possibleSizes(); track size) {
				<div
					class="option-item"
					[class.is-selected]="selectedSize() === size"
					(click)="onSizeChange(size)"
				>
					{{ size }}
				</div>
			}
		</div>
	</div> -->
</div>

<!-- El Editor se mantiene intacto, escuchando las mismas Signals del componente padre -->
<div class="editor-area">
	<textarea
		placeholder="Type your text here..."
		[style.color]="selectedColor()"
		[style.font-family]="selectedFont()"
		[style.font-size]="selectedSize()"
	></textarea>
</div>
