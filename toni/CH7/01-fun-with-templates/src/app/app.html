
<!--
  EVOLUCIÓN ARQUITECTÓNICA:
  Ya no existen las etiquetas separadas <ng-template #nameTemplate>.
  Colocamos el <ng-template> justo en el bloque donde se renderizará.
  Angular detecta automáticamente el elemento gracias al query de contenido.
-->

<!-- Área de Selectores de Color con Plantilla Encastrada -->
<div class="colors-area">
  <app-item-selector
    title="Colors"
    [options]="possibleColors()"
    [(selectedOption)]="selectedColor">

    <!-- Capturamos el contexto implícito de la iteración interna directamente aquí -->
    <ng-template let-color>
      <span [style.color]="color"> {{ color }}</span>
    </ng-template>

  </app-item-selector>
</div>

<!-- Área de Selectores de Fuente con Plantilla Encastrada -->
<div class="fonts-area">
  <app-item-selector
    title="Fonts"
    [options]="possibleFonts()"
    [(selectedOption)]="selectedFont">

    <!-- optional Template for Fonts -->
    <ng-template let-font>
      <span [style.font-family]="font"> {{ font }}</span>
    </ng-template>
  </app-item-selector>
</div>

<!-- El Selector de Tamaño sigue funcionando por defecto (Fallback de Texto Plano) -->
<div class="sizes-area">
  <app-item-selector title="Sizes" [options]="possibleSizes()" [(selectedOption)]="selectedSize" />
</div>

<div class="editor-area">
	<textarea
		placeholder="Type your text here..."
		[style.color]="selectedColor()"
		[style.font-family]="selectedFont()"
		[style.font-size]="selectedSize()"
	></textarea>
</div>
