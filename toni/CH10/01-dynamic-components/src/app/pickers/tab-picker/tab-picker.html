<!-- RECEPTOR AVANZADO: Renderiza un grupo de botones tipo pestaña alternando la clase 'active' -->
<div class="tab-picker">
  @for (opt of options(); track opt.value) {
    <button
      class="tab-btn"
      [class.active]="opt.value === value()"
      (click)="select(opt.value)"
    >
      {{ opt.label }}
    </button>
  }
</div>
